[project]
name = "morocovoice"
version = "1.0.3"
description = "Industrial voice dictation and contextual rewriting suite for Windows 10/11 x64 (Wispr Flow parity)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ricardo García", email = "rgarcia@telat-group.com" }
]
keywords = ["dictation", "speech-to-text", "whisper", "groq", "windows", "voice", "rewriter"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # Line length handled softly
    "UP006", # Typing compatibility
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
